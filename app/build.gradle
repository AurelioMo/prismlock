plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.aureliomo.prismlock'
    compileSdk 36
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'io.github.aureliomo.prismlock'
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName '0.2.0-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
