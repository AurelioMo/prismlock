plugins {
    id 'com.android.application'
}
def signingPath = providers.environmentVariable('PRISMLOCK_KEYSTORE').orNull
def signingPassword = providers.environmentVariable('PRISMLOCK_STORE_PASSWORD').orNull
def signingKeyPassword = providers.environmentVariable('PRISMLOCK_KEY_PASSWORD').orNull
android {
    namespace 'io.github.aureliomo.prismlock'
    compileSdk 36
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'io.github.aureliomo.prismlock'
        minSdk 26
        targetSdk 34
        versionCode 147
        versionName '1.4.7'
    }
    signingConfigs {
        release {
            if (signingPath && signingPassword && signingKeyPassword) {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias 'prismlock'
                keyPassword signingKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            if (signingPath && signingPassword && signingKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Android 16's Robolectric runtime accesses the JDK file-descriptor bridge.
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'assembleRelease' || task.name == 'bundleRelease') {
        task.doFirst {
            if (!signingPath || !signingPassword || !signingKeyPassword) {
                throw new GradleException('Release signing requires PRISMLOCK_KEYSTORE, PRISMLOCK_STORE_PASSWORD and PRISMLOCK_KEY_PASSWORD.')
            }
        }
    }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
